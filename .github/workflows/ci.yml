# Runs on push and pull request only. There is deliberately no `schedule:` here
# - a cron in a repo nobody is watching bills Actions minutes forever for a
# result nobody reads.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt
      # The API tests run against a seeded world rather than fixtures, because
      # a 403 on execute and a CSP header on an error response only exist once
      # the whole app is assembled. Seeding is ~30s.
      - name: seed the world
        run: PYTHONPATH=backend python -m scripts.seed_world --scale demo
      - name: tests
        run: python -m pytest backend -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
