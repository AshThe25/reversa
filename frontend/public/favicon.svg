<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The header logomark at tab size: black tile, yellow R. A tab icon has to
       survive 16px, so this is the wordmark's initial rather than the hero
       artwork, which turns to mud at that scale. -->
  <rect width="64" height="64" rx="10" fill="#111111"/>
  <text x="32" y="46" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="800" fill="#f5d949">R</text>
</svg>
